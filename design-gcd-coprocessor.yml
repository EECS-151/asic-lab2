# Specify Global Variables
gcd.clockPeriod: &CLK_PERIOD "20ns"
gcd.verilogSrc: &VERILOG_SRC
  - "src/gcd_coprocessor.sv"
  - "src/gcd_datapath.sv"
  - "src/gcd_control.sv"
  - "src/fifo.sv"
  - "src/EECS151.sv"

# Specify clock signals
vlsi.inputs.clocks: [
  {name: "clk", period: *CLK_PERIOD, uncertainty: "0.1ns"}
]

# Synthesis Constraints
synthesis.inputs:
  top_module: "gcd_coprocessor"
  input_files: *VERILOG_SRC

# Placement Constraints
vlsi.inputs.placement_constraints:
  - path: "gcd_coprocessor"
    type: "toplevel"
    x: 0
    y: 0
    width: 600
    height: 600
    margins:
      left: 10
      right: 10
      top: 10
      bottom: 10
  - path: "gcd_coprocessor/GCDdpath0" # TODO: change this to the name of your datapath module
    type: "placement"
    x: 200
    y: 200
    width: 200
    height: 200

# Pin placement constraints
vlsi.inputs.pin_mode: generated
vlsi.inputs.pin.generate_mode: semi_auto
vlsi.inputs.pin.assignments: [
  {pins: "*", layers: ["met2", "met4"], side: "bottom"}
]

# SCL has no tapcells, so Hammer's auto rail-generation step crashes.
par.generate_power_straps_options.by_tracks.generate_rail_layer: false
