# Post-Synthesis Gate-Level Simulation Variables
sim.inputs:
  input_files:
    - "src/gcd_coprocessor_testbench.sv"
  input_files_meta: append
  level: "syn"
  timing_annotated: true
  timescale: "1ns/10ps"
  options:
    - "-notice"
    - "+lint=all"
    - "+neg_tchk"
    - "-sverilog"
    - "-debug_access+all"
    - "-kdb"
  top_module: "gcd_coprocessor"
  tb_name: "gcd_coprocessor_testbench"
  defines: 
    - "CLOCK_PERIOD=20.00"
    - "FUNCTIONAL"
    - "UNIT_DELAY=#1"
