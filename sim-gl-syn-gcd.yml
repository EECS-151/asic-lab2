# Post-Synthesis Gate-Level Simulation Variables
sim.inputs:
  input_files:
    - "src/gcd_testbench.sv"
  input_files_meta: append
  level: "syn"
  timing_annotated: true
  timescale: "1ns/10ps"
  options:
    - "-notice"
    - "+lint=all"
    - "-sverilog"
    - "-debug_access+all"
    - "-kdb"
  top_module: "gcd"
  tb_name: "gcd_testbench"
  tb_dut: "gcd"
  defines: 
    - "CLOCK_PERIOD=20.00000"
